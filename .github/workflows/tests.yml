name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.3', '8.4', '8.5']

    # Tests run on PostgreSQL, like production (phpunit.xml -> table4all_testing).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: table4all
          POSTGRES_PASSWORD: table4all
          POSTGRES_DB: table4all_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U table4all -d table4all_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          # No coverage report is produced; Xdebug would only slow the tests and PHPStan down.
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Node Dependencies
        run: npm ci --no-audit --no-fund

      # setup-php doesn't cache Composer downloads; restore them so installs skip the network.
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Type Analysis
        run: composer types:check

      - name: Tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: table4all
          DB_PASSWORD: table4all
        run: php artisan test
