memory_limit = 256M
; "Hoje tem!" videos go up to 50 MB (RestaurantStory::MAX_VIDEO_KB); each route validates its own limit.
upload_max_filesize = 55M
post_max_size = 60M
; Requests on the hot paths finish in milliseconds; anything near this limit is a
; bug and should fail instead of holding a worker during a rush.
max_execution_time = 30

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Laravel resolves thousands of file paths per request; cache them across requests.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
