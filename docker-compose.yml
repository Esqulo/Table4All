services:
  app:
    build:
      context: .
      args:
        VITE_APP_NAME: ${APP_NAME:-Table4All}
    env_file:
      - .env.docker
    environment:
      # Always talk to the "db" service below, regardless of what DB_HOST
      # happens to be set to in .env.docker.
      DB_HOST: db
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - storage_data:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
  storage_data:
