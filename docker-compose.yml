services:
  app:
    build:
      context: .
      args:
        VITE_APP_NAME: ${APP_NAME:-Table4All}
    env_file:
      # Required for the production stack; the dev override
      # (docker-compose.override.yml) supplies its own config instead.
      - path: .env.docker
        required: false
    environment:
      # Always talk to the "db" service below, regardless of what DB_HOST
      # happens to be set to in .env.docker.
      DB_HOST: db
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - storage_data:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-table4all}
      POSTGRES_USER: ${DB_USERNAME:-table4all}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      # Exposed on the host so a GUI client (DBeaver, TablePlus, ...) can
      # connect. Not 5432, so it doesn't clash with a locally-installed
      # Postgres used for non-Docker development.
      - "${DB_FORWARD_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-table4all} -d ${DB_DATABASE:-table4all}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
  storage_data:
