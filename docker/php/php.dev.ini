memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 300

expose_php = Off
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr

; No opcache in dev: every request should see the current source on disk.
opcache.enable = 0
opcache.enable_cli = 0
