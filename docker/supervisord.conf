[supervisord]
nodaemon = true
user = root
logfile = /dev/stdout
logfile_maxbytes = 0
pidfile = /var/run/supervisord.pid

[program:php-fpm]
command = php-fpm -F
autostart = true
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = nginx -g "daemon off;"
autostart = true
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:queue-worker]
; Lowest CPU priority: background jobs (video conversion with ffmpeg, mail, geocoding)
; inherit it, so they only use what the requests of the live screens leave free.
command = nice -n 19 php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
; Same user as php-fpm: files it creates (logs, compiled views) must stay writable by the site.
user = www-data
autostart = true
autorestart = true
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:scheduler]
command = sh -c "while true; do php /var/www/html/artisan schedule:run --no-interaction; sleep 60; done"
user = www-data
autostart = true
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
