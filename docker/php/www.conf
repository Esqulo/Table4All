[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000
; Absorb bursts (e.g. many customers ordering at once) instead of refusing connections.
listen.backlog = 511

; Keep warm workers ready: spawning a worker mid-rush adds latency to the request
; that triggered it. Each worker uses roughly 30-60 MB.
;
; Sized for a small VPS (2 vCPU, 2-4 GB shared with Postgres): a polling request
; takes ~10-30 ms, so a busy venue (~7 requests/s) keeps fewer than one worker
; busy on average and 8 absorb the bursts. On a bigger host raise max_children to
; about (RAM for PHP) / 50 MB and the spares with it (see docs/performance.md).
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
; Recycle workers periodically so slow memory growth never builds up during a shift.
pm.max_requests = 1000
; Hard stop for a request stuck on I/O (max_execution_time doesn't count I/O wait).
request_terminate_timeout = 60s

; Let PHP-FPM workers see variables injected via the container environment
; (docker-compose env_file), not just a physical .env file.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no

php_admin_flag[log_errors] = on
php_admin_value[error_log] = /dev/stderr
